<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cetak Kartu &amp; Sertifikat — GTKPRESA 2026</title>
<link rel="stylesheet" href="shared/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.badge-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; padding: 14px; }
.a4-sheet { display: grid; grid-template-columns: repeat(2, 105mm); grid-auto-rows: 148mm; gap: 0; justify-content: center; align-content: start; }
.badge {
  --c1: #7A5A00; --c2: #C9A227; --acc: #B08D2B;
  width: 105mm; height: 148mm; box-sizing: border-box; position: relative; overflow: hidden; flex: 0 0 auto;
  background: #fff; font-family: "Segoe UI", "Lato", Arial, sans-serif; color: #12313a; line-height: 1.2; font-size: 16px;
  border-radius: 4mm; box-shadow: 0 4px 18px rgba(0,0,0,.2);
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.badge.peran-panitia { --c1: #0B4B33; --c2: #1E9460; --acc: #1E9460; }
.badge.peran-pemeriksa_berkas { --c1: #1B3A6B; --c2: #3F74B0; --acc: #3F74B0; }
.badge .abs { position: absolute; }
/* sisi vertikal kanan */
.badge .sisi { top: 0; bottom: 0; right: 0; width: 19mm; background: linear-gradient(200deg, var(--c2) 0%, var(--c1) 100%); }
.badge .sisi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1.3mm; background: linear-gradient(#F2DE9A, #B08D2B); }
.badge .sisi::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(255,255,255,.06) 0 2mm, transparent 2mm 5mm); }
.badge .sisi span { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; color: #fff; font-weight: 800; font-size: 7.2mm; letter-spacing: 3.2mm; text-shadow: 0 .4mm 1mm rgba(0,0,0,.3); z-index: 2; padding-left: 1.3mm; }
.badge .body { top: 0; left: 0; bottom: 0; width: 86mm; }
/* header */
.badge .head { top: 0; left: 0; width: 86mm; height: 36mm; background: linear-gradient(140deg, #0A3440 0%, #0F5560 60%, #14707A 100%); clip-path: ellipse(115% 100% at 40% 0%); overflow: hidden; }
.badge .head::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, rgba(255,255,255,.05) 0 2.2mm, transparent 2.2mm 5mm); }
.badge .slot { top: 3mm; left: 36mm; width: 14mm; height: 2.6mm; border-radius: 1.3mm; background: #fff; box-shadow: inset 0 0 0 .3mm rgba(0,0,0,.35); z-index: 6; }
.badge .logos { top: 9mm; left: 4mm; z-index: 3; }
.badge .logos .pill { background: #fff; border-radius: 4mm; height: 12mm; padding: 0 2.4mm; display: flex; align-items: center; gap: 1.8mm; box-shadow: 0 .6mm 2mm rgba(0,0,0,.28); }
.badge .logos img { height: 9.6mm; width: auto; display: block; }
.badge .judul { top: 11mm; right: 23mm; text-align: right; z-index: 3; color: #fff; }
.badge .judul b { display: block; color: #F2DE9A; font-size: 3.9mm; letter-spacing: .3mm; font-weight: 800; white-space: nowrap; }
.badge .judul span { display: block; font-size: 2.15mm; font-weight: 600; letter-spacing: .25mm; margin-top: 1mm; line-height: 1.35; opacity: .95; }
/* foto 4x6 cm */
.badge .foto { top: 29mm; left: 23mm; width: 40mm; height: 60mm; box-sizing: border-box; border-radius: 3mm; padding: 1mm; background: #fff; box-shadow: 0 0 0 1.1mm var(--acc), 0 1.2mm 4mm rgba(0,0,0,.28); z-index: 4; }
.badge .foto .in { width: 100%; height: 100%; border-radius: 2.2mm; overflow: hidden; background: #eef2f2; }
.badge .foto-img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; display: block; }
.badge .foto-kosong { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 3.2mm; color: #8a9a9a; }
/* identitas */
.badge .nama { top: 93mm; left: 4mm; width: 78mm; height: 19mm; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 800; font-size: 6.4mm; line-height: 1.12; color: #0A3440; }
.badge .nama.panjang { font-size: 5.2mm; }
.badge .nama.sangat-panjang { font-size: 4.3mm; }
.badge .jabatan { top: 113.5mm; left: 8mm; width: 70mm; display: flex; justify-content: center; }
.badge .jabatan span { display: inline-block; max-width: 100%; padding: 1.3mm 5mm; border-radius: 4mm; background: linear-gradient(90deg, var(--c1), var(--c2)); color: #fff; font-weight: 700; font-size: 3.5mm; letter-spacing: .3mm; text-align: center; box-shadow: 0 .5mm 1.5mm rgba(0,0,0,.2); }
.badge .instansi { top: 123mm; left: 6mm; width: 74mm; text-align: center; font-size: 3.2mm; font-weight: 600; color: var(--c1); line-height: 1.25; }
/* footer */
.badge .foot { left: 0; bottom: 0; width: 86mm; height: 10mm; background: linear-gradient(90deg, #0A3440, #0F5560); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 4mm; font-size: 2.5mm; white-space: nowrap; }
.badge .foot b { color: #F2DE9A; font-weight: 700; }
.badge .foot::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: .8mm; background: linear-gradient(90deg, #B08D2B, #F2DE9A, #B08D2B); }
.sertifikat-page .ttd-block { margin-top: 30px; }
@media print {
  body { margin: 0; }
  .badge-grid { display: block; padding: 0; }
  .badge { box-shadow: none; border-radius: 0; }
  .badge-grid.mode-a4 .a4-sheet { break-inside: avoid; }
  .badge-grid.mode-a4 .a4-sheet + .a4-sheet { break-before: page; page-break-before: always; }
  .badge-grid.mode-a4 .badge { outline: .1mm dashed #9aa; outline-offset: -.1mm; }
  .badge-grid.mode-satu .badge { display: block; break-inside: avoid; }
  .badge-grid.mode-satu .badge + .badge { break-before: page; page-break-before: always; }
  html, body { height: auto; }
}
</style>

<div class="topbar no-print">
  <div>
    <h1>Cetak Kartu &amp; Sertifikat</h1>
    <div class="sub">Dewan Juri, Panitia &amp; Tim Pemeriksa — GTKPRESA 2026</div>
  </div>
  <div class="right">
    <button class="btn btn-outline btn-sm" onclick="window.location.href='admin.html'">← Kembali ke Admin</button>
    <button class="btn btn-primary btn-sm" onclick="cetak()">🖨️ Cetak / Simpan PDF</button>
  </div>
</div>

<div class="container no-print">
  <div class="card">
    <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;">
      <div style="flex:1; min-width:150px;">
        <label>Kelompok</label>
        <select id="selKelompok" onchange="isiPilihanOrang(); render()">
          <option value="juri">Dewan Juri</option>
          <option value="panitia">Panitia</option>
          <option value="pemeriksa_berkas">Tim Pemeriksa Berkas</option>
        </select>
      </div>
      <div style="flex:1; min-width:150px;">
        <label>Yang dicetak</label>
        <select id="selMode" onchange="render()">
          <option value="kartu">Badge / Kartu (A6, foto 4x6 cm)</option>
          <option value="sertifikat">Sertifikat Juri</option>
        </select>
      </div>
      <div style="flex:1; min-width:150px;" id="boxKertas">
        <label>Kertas cetak</label>
        <select id="selKertas" onchange="render()">
          <option value="a4">A4 — 4 badge per lembar (ukuran A6), lalu digunting</option>
          <option value="satu">Satu badge per halaman (kertas A6)</option>
        </select>
      </div>
      <div style="flex:2; min-width:220px;">
        <label>Nama</label>
        <select id="selJuri" onchange="render()"></select>
      </div>
    </div>
    <div id="info" style="font-size:12.5px; color:var(--grey); margin-top:10px; line-height:1.6;"></div>
    <p style="font-size:12px; color:var(--grey); margin-top:6px;">Pilih <b>"Semua"</b> untuk mencetak sekaligus. Pada jendela cetak, pilih <b>Save as PDF</b> bila ingin disimpan sebagai PDF. Badge dicetak ukuran A6 (portrait), sertifikat otomatis landscape.</p>
  </div>
</div>

<div id="area"></div>

<script src="shared/supabase-client.js"></script>
<script>
let semua = [], kategoriMap = {}, ttd = { nama: "", jabatan: "" };

async function init() {
  const profile = await requireAuth(["admin_provinsi"]);
  if (!profile) return;

  const { data: kat } = await sb.from("kategori_lomba").select("id, nama");
  kategoriMap = Object.fromEntries((kat || []).map(k => [k.id, k.nama]));

  const { data: st } = await sb.from("app_settings").select("*").in("key", ["sertifikat_nama_penandatangan", "sertifikat_jabatan_penandatangan"]);
  const sm = Object.fromEntries((st || []).map(s => [s.key, s.value]));
  ttd = { nama: sm.sertifikat_nama_penandatangan || "", jabatan: sm.sertifikat_jabatan_penandatangan || "" };

  const { data: akun } = await sb.from("profiles").select("id, nama, role, kategori_ditugaskan").in("role", ["juri","panitia","admin_provinsi","pemeriksa_berkas"]).eq("aktif", true).order("nama");
  const { data: pj } = await sb.from("profil_juri").select("*");
  const map = Object.fromEntries((pj || []).map(x => [x.user_id, x]));

  semua = [];
  for (const a of (akun || [])) {
    const d = map[a.id];
    let foto = null;
    if (d?.foto_path) {
      const { data: su } = await sb.storage.from("foto-juri").createSignedUrl(d.foto_path, 3600);
      foto = su?.signedUrl || null;
    }
    semua.push({
      id: a.id, kelompok: a.role === "admin_provinsi" ? "panitia" : a.role, nama: d?.nama_lengkap || a.nama, jabatan: d?.jabatan || "", instansi: d?.instansi || "",
      foto, lengkap: !!(d && d.foto_path),
      kategori: (a.kategori_ditugaskan || []).map(i => kategoriMap[i]).filter(Boolean)
    });
  }

  isiPilihanOrang();
  render();
}

function daftarKelompok() {
  const k = document.getElementById("selKelompok").value;
  return semua.filter(j => j.kelompok === k);
}
function isiPilihanOrang() {
  document.getElementById("selJuri").innerHTML = '<option value="all">Semua</option>' +
    daftarKelompok().map(j => `<option value="${j.id}">${escapeHtml(j.nama)}${j.lengkap ? "" : " (profil belum lengkap)"}</option>`).join("");
}
function terpilih() {
  const v = document.getElementById("selJuri").value;
  const dk = daftarKelompok();
  return v === "all" ? dk : dk.filter(j => j.id === v);
}
const PERAN = { juri: "DEWAN JURI", panitia: "PANITIA", pemeriksa_berkas: "PEMERIKSA" };
const PERAN_KALIMAT = { juri: "Dewan Juri", panitia: "Panitia", pemeriksa_berkas: "Tim Pemeriksa Berkas" };

function fotoHtml(j) {

function badgeHtml(j) {

    <div class="abs foto"><div class="in">${j.foto ? `<img class="foto-img" src="${j.foto}" alt="Foto">` : `<div class="foto-kosong">Tempel<br>pas foto<br>4 × 6 cm</div>`}</div></div>
    <div class="abs nama ${kls}"><span>${escapeHtml(j.nama)}</span></div>
    <div class="abs jabatan"><span>${escapeHtml(jabatan)}</span></div>
    <div class="abs instansi">${escapeHtml(j.instansi)}</div>
    <div class="abs foot"><span><b>14 &amp; 15 Okt 2026</b> · MAN 1 Banda Aceh</span><span>Wajib dipakai</span></div>
  </div>`;
}

function sertifikatHtml(j) {
  const tgl = new Date().toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
  const kat = j.kategori.length ? ` pada mata lomba <b>${j.kategori.map(escapeHtml).join(", ")}</b>` : "";
  return `
  <div class="sertifikat-page">
    <div class="kop-cert">
      <img src="${urlLogoKemenag()}" onerror="this.style.display='none'">
      <div class="instansi">KEMENTERIAN AGAMA REPUBLIK INDONESIA</div>
      <div class="instansi-sub">Kantor Wilayah Kementerian Agama Provinsi Aceh</div>
    </div>
    <hr>
    <div class="judul-sert">SERTIFIKAT</div>
    <div class="sub-sert">Nomor: ......../GTKPRESA/2026</div>
    <div class="isi-sert">Diberikan kepada:</div>
    <div class="nama-penerima">${escapeHtml(j.nama)}</div>
    <div class="isi-sert">
      ${escapeHtml(j.jabatan)}${j.jabatan && j.instansi ? " — " : ""}${escapeHtml(j.instansi)}<br>
      Sebagai <b>${PERAN_KALIMAT[j.kelompok]}</b> pada Anugerah Guru dan Tenaga Kependidikan Berprestasi (GTKPRESA)<br>
      Provinsi Aceh Tahun 2026${j.kelompok === "juri" ? kat : ""}, yang diselenggarakan pada 14 &amp; 15 Oktober 2026 di Banda Aceh.
    </div>
    <div class="ttd-block">
      <div>Banda Aceh, ${tgl}</div>
      <div style="margin-top:2px;">${escapeHtml(ttd.jabatan) || "Ketua Panitia GTKPRESA 2026"}</div>
      <div style="margin-top:8px;"><img src="${urlBarcodeTtd()}" style="height:70px;" onerror="this.style.display='none'"></div>
      <div class="garis">${escapeHtml(ttd.nama) || "( ......................................... )"}</div>
    </div>
  </div>`;
}

function render() {
  const mode = document.getElementById("selMode").value;
  const kertas = document.getElementById("selKertas").value;
  const list = terpilih();
  document.getElementById("boxKertas").style.display = mode === "kartu" ? "" : "none";
  document.body.className = "mode-" + mode;
  document.getElementById("pageStyle").textContent = mode === "kartu"
    ? (kertas === "satu" ? "@media print { @page { size: 105mm 148mm; margin: 0; } }" : "@media print { @page { size: A4 portrait; margin: 0; } }")
    : "@media print { @page { size: A4 landscape; margin: 0; } }";
  const tanpaFoto = list.filter(j => !j.lengkap).length;
  document.getElementById("info").innerHTML = `${list.length} orang akan dicetak.` +
    (tanpaFoto && mode === "kartu" ? ` <b style="color:var(--red);">⚠ ${tanpaFoto} orang belum mengunggah foto/profil</b> — badge akan berisi kotak "Tempel pas foto 4 × 6 cm" (bisa ditempel manual).` : "") +
    (mode === "kartu" ? (kertas === "satu" ? " Pada jendela cetak pilih ukuran kertas <b>A6 (105 x 148 mm)</b>, skala <b>100%</b>, margin <b>None</b>." : " Pada jendela cetak pilih kertas <b>A4</b>, skala <b>100%</b> (bukan Fit to page), margin <b>None</b>. Gunting mengikuti garis putus-putus.") : "");
  let html;
  if (mode === "kartu") {
    if (kertas === "satu") html = `<div class="badge-grid mode-satu">${list.map(badgeHtml).join("")}</div>`;
    else {
      const sheets = [];
      for (let i = 0; i < list.length; i += 4) sheets.push(`<div class="a4-sheet">${list.slice(i, i + 4).map(badgeHtml).join("")}</div>`);
      html = `<div class="badge-grid mode-a4" style="flex-direction:column; align-items:center;">${sheets.join("")}</div>`;
    }
  } else html = list.map(sertifikatHtml).join("");
  document.getElementById("area").innerHTML = html;
}

async function cetak() {
  const imgs = Array.from(document.querySelectorAll("#area img"));
  await Promise.all(imgs.map(i => i.complete ? null : new Promise(r => { i.onload = i.onerror = r; })));
  window.print();
}

init();
</script>
</body>
</html>
