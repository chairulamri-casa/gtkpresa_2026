<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTKPRESA 2026 — Atur Ulang Kata Sandi</title>
<link rel="stylesheet" href="shared/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <h1>Atur Ulang Kata Sandi</h1>
    <div class="sub">GTKPRESA 2026</div>
    <div id="msg"></div>

    <div id="formBox" style="display:none;">
      <label>Kata Sandi Baru</label>
      <input type="password" id="password" placeholder="minimal 6 karakter">
      <label>Ulangi Kata Sandi Baru</label>
      <input type="password" id="password2">
      <button class="btn btn-primary" style="width:100%; margin-top:16px; padding:11px;" onclick="simpanSandiBaru()">Simpan Kata Sandi Baru</button>
    </div>

    <div class="footer-note" style="margin-top:18px;"><a href="index.html">Kembali ke halaman Masuk</a></div>
  </div>
</div>

<script src="shared/supabase-client.js"></script>
<script>
const msg = document.getElementById("msg");

// Supabase otomatis mendeteksi token pemulihan dari tautan email dan
// memicu event PASSWORD_RECOVERY -- baru setelah itu form aman ditampilkan.
sb.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY") {
    document.getElementById("formBox").style.display = "block";
  }
});

// Jaga-jaga: kalau setelah 3 detik event belum muncul tapi ternyata
// sudah ada sesi aktif (browser sempat memuat ulang), tetap tampilkan form.
setTimeout(async () => {
  if (document.getElementById("formBox").style.display === "none") {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      document.getElementById("formBox").style.display = "block";
    } else {
      msg.innerHTML = '<div class="msg msg-error">Tautan tidak valid atau sudah kedaluwarsa. Silakan minta tautan reset baru dari halaman Masuk.</div>';
    }
  }
}, 3000);

async function simpanSandiBaru() {
  msg.innerHTML = "";
  const password = document.getElementById("password").value;
  const password2 = document.getElementById("password2").value;
  if (!password || password.length < 6) { msg.innerHTML = '<div class="msg msg-error">Kata sandi minimal 6 karakter.</div>'; return; }
  if (password !== password2) { msg.innerHTML = '<div class="msg msg-error">Ulangi kata sandi tidak sama.</div>'; return; }

  const { error } = await sb.auth.updateUser({ password });
  if (error) { msg.innerHTML = `<div class="msg msg-error">Gagal menyimpan: ${error.message}</div>`; return; }

  msg.innerHTML = '<div class="msg msg-success">Kata sandi berhasil diperbarui! Mengalihkan ke halaman Masuk...</div>';
  document.getElementById("formBox").style.display = "none";
  await sb.auth.signOut();
  setTimeout(() => { window.location.href = "index.html"; }, 1800);
}
</script>
</body>
</html>
